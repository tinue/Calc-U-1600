# Release configuration for ReleaseIt's `release` command
# (https://github.com/tinue/ReleaseIt).
#
# Nothing is built locally: .github/workflows/build.yml (workflow_dispatch
# only, no publish job of its own) is the only, authoritative build. A
# pre-release dispatches it against the "vX.Y.Z-pre" tag, waits, downloads
# the artifacts and publishes them. The Windows installer is unsigned.

name: Calc-U-1600

version:
  preset: cmake
  file: Qt6/CMakeLists.txt

release:
  # GitHub Releases doesn't preserve Unix file permissions on uploaded
  # assets, so a downloaded .AppImage always loses its executable bit —
  # this has to be told to users rather than fixed in packaging.
  notes_suffix: >-
    **Linux**: the downloaded .AppImage needs its executable bit set before it
    will run — GitHub Releases doesn't preserve file permissions on uploaded
    assets. Run `chmod +x Calc-U-1600-*.AppImage` once after downloading, then
    launch it directly.
  extra_assets:
    - { zip: examples/, as: Calc-U-1600-examples.zip }

build:
  - kind: github-dispatch
    workflow: build.yml
    artifacts:
      - { artifact: Calc-U-1600-linux-x86_64,   file: "Calc-U-1600-*.AppImage", as: Calc-U-1600-linux-x86_64.AppImage, executable: true }
      - { artifact: Calc-U-1600-linux-aarch64,  file: "Calc-U-1600-*.AppImage", as: Calc-U-1600-linux-aarch64.AppImage, executable: true }
      - { artifact: Calc-U-1600-mac-aarch64,    file: Calc-U-1600.dmg,          as: Calc-U-1600-mac-aarch64.dmg }
      - { artifact: Calc-U-1600-windows-x86_64, file: Calc-U-1600-Setup.exe,    as: Calc-U-1600-windows-x86_64.exe }
      - { artifact: Calc-U-1600-windows-arm64,  file: Calc-U-1600-Setup-arm64.exe, as: Calc-U-1600-windows-arm64.exe }
