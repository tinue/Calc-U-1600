# macOS-only screenshots of the native menu bar
# (`method: system`). The terminal (or whatever launches the run) needs the
# Screen Recording, Accessibility and Automation (System Events)
# permissions. Not byte-identical between runs (screen contents).
out: ../images
window: 1430x1000  # the PC-1600's minimum width

shots:
  - name: machine-model-menu
    preset: presets/pc1600-hello.pc1600
    steps:
      - menu: Machine > Model
    capture: { method: system, target: screen-region, file: macos-machine-model-menu.png }
