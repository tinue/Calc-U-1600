# CE-502B -- Sharp's "Statistics" program module for the PC-1500 family:
# a 16 KB mask ROM holding a ready-to-run BASIC program.
#
# It plugs into the 40-pin memory-module slot and answers on Y0
# (&0000-&3FFF), where a RAM module would sit. Layout (the program-module
# convention, per Jeff Birt's dump notes):
#   &0000-&0007  ROM header: 55 (marker) 00 (ROM top, high byte)
#                00 C5 (top of the BASIC program) 40 (size: 16 KB)
#                00 00 FF (FF = LIST allowed)
#   &0008-&00C4  reserve area: the DEF-key labels HG BD PD ND WD ED CD STD
#                FD MLR and their key strings
#   &00C5-       the tokenized BASIC program
#
# Bytes: Jeff Birt's dump (https://github.com/Jeff-Birt/PC-1500_ROM_Modules,
# CE-502B_Statistics/CE-502B.bin), taken over a CE-158 with
# CSAVEM"...";&0000,&3FFF -- the 27-byte CE-158 header and the one extra
# byte past &3FFF are dropped. The firmware is Sharp's copyrighted work,
# included on the same terms as the ROM images in roms/ (see
# THIRD-PARTY-NOTICES.md).
#
# `content: rom`: read-only for everything, including a host poke --
# which is also why there is no `battery:` (nothing to keep).

module-name: "CE-502B"
template: true   # read-only starting point; Name & Save copies it
compatible-hosts: [PC-1500, PC-1500A]
definition-terminology: PC-1500

