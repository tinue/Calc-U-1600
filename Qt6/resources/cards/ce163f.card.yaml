# CE-163F -- 256 KB banked module for the PC-1500 family: 8 RAM banks +
# 8 FLASH banks (Microchip SST39SF010A).
#
# The real module, expressed through the general software-defined system
# now that it supports Flash content + `by-bank` split content
# (Memory-Card-Definition-Spec.md §5) -- Core/Connector/CE163FCard.hpp
# remains the hand-written prototype this was ported from (per its own doc
# comment, "the concrete reference for every Flash field", recovered from
# a real CE163F firmware disassembly:
# ~/Development/sharp/pc1500/CE-163X/CE-163F/update-selfpatch.asm).
#
# One banked 16 KB window at Y0 (&0000-&3FFF), 16 banks, 256 KB total, same
# trigger-based mechanism as CE-163/CE-1638: a write strobe on physical
# pin 18 (S3 on the PC-1500, S5 on the PC-1500A) latches a bank number
# sampled from the *address* lines of that same write. 16 real banks, so
# all 4 sampled bits (A0-A3) map straight to banks 0-15, no mod-wrap.
#
# Banks 0-7 are plain read/write RAM. Banks 8-15 are FLASH, not freely
# writable at guest runtime -- a bare CPU store does nothing; a byte
# program or sector erase needs the JEDEC-style unlock sequence below.
# Flash command decode watches only the low 11 address bits of each write
# into the Y0 window while a flash bank is selected (`command-address-mask:
# 0x7FF`) -- a real recovered hardware quirk, which is why the firmware's
# unlock addresses are &1555/&2AAA, not the datasheet's &5555/&2AAA
# (&1555 & 0x7FF == &555). The command decoder belongs to the flash
# *chip*, sitting behind the module's bank/window latch -- the two are
# independent state machines (see SoftwareDefinedCard::flashWrite's doc
# comment): the bank-select strobe never resets the flash decoder, exactly
# as the real firmware's unlock cycle interleaves writes to the module's
# bank-select port with the flash-address writes.
#
# Power-up fill differs by bank kind, purely as an analysis aid (matches
# CE163FCard::kFlashInitFill): RAM banks fill 0xFF (this project's SRAM
# convention); FLASH banks fill 0xAA, so a memory dump can tell
# "never-touched flash" apart from both an erased sector (0xFF) and
# freshly powered-up RAM.
#
# PC-1600 slot / Slot-1 caveat: same as ce1638.card.yaml -- see that
# file's doc comment and MinorIssues.md.
#
# Deliberately not modeled (same scope CE163FCard.hpp stops at): DQ6/DQ7
# toggle-bit status polling, software-ID/autoselect, and simulated
# program/erase timing -- none of it is exercised by the real firmware.

module-name: "CE-163F"
compatible-hosts: [PC-1500, PC-1500A, PC-1600-Slot-1, PC-1600-Slot-2]
definition-terminology: PC-1500
battery: true

regions:
  - name: sram-flash-256k
    addressing:
      chip-select: Y0
    banking:
      latch:
        type: trigger-based
        trigger: { pin: 18 }             # S3 (PC-1500) / S5 (PC-1500A) write strobe
        sampled-lines: [A0, A1, A2, A3]  # bank number from the triggering write's address
        source-domain: address
      bank-count: 16
      bank-size: 0x4000                  # 16 KB, exactly the Y0 window
      bank-window:
        chip-select: Y0
        span: 0x4000
        maps-to: 0x0000
    content:
      by-bank:
        - banks: "0-7"
          kind: regular
          writable: true
          power-up-fill: 0x00
        - banks: "8-15"
          kind: flash
          power-up-fill: 0xAA
          protocol:
            unlock-sequence:
              - { address: 0x1555, data: 0xAA }
              - { address: 0x2AAA, data: 0x55 }
            byte-program-command: 0xA0
            erase-setup-command:  0x80
            sector-erase-command: 0x30
            chip-erase-command:   0x10
            reset-command:        0xF0
            sector-size:          0x1000  # 4 KB (SST39SF010A: 32 x 4K sectors)
            command-address-mask: 0x7FF   # chip decodes only the low 11 address bits
    initial-content:
      blocks:
