# CE-1638 -- 128 KB banked SRAM module for the PC-1500 family.
#
# The real Sharp-compatible module. One banked 16 KB window at Y0 (&0000-&3FFF), 8 banks, 128 KB total, same
# trigger-based mechanism as CE-163 (Memory-Card-Definition-Spec.md §6): a
# write strobe on physical pin 18 (S3 on the PC-1500, S5 on the PC-1500A)
# latches a bank number sampled from the *address* lines of that same
# write, not the data bus.
#
# Bank select samples A0-A2 -- confirmed real-hardware behavior, per
# ~/Development/sharp/pc1500/CE-163X/CE1638-CE163F-BankSwitching-Reference.md
# ("the CE1638 reportedly uses A0-A2 for bank select"). 3 bits exactly
# cover the 8 banks, so unlike the CE-163 family's 4-bit (A0-A3) sampling
# used elsewhere for a hypothetical 16-bank module, no mod-wrap is needed
# here.
#
# PC-1600 slot: plugs into a MemorySlotConnector pin-for-pin, decoding
# purely from pins like every other card here. Pin 4's chip select is
# &8000-&BFFF on a PC-1600 slot rather than a PC-1500's &0000-&3FFF Y0, so
# the bank window's `span`/low-address-bits offsetting handles that for
# free -- no per-host branch needed.
#
# Slot 1 caveat: pin 18 carries S3 there, which the PC-1600
# mainboard pulses on every &B000-&B7FF write, so the boot ROM's
# RAM-sizing scan keeps tripping the bank latch and the module doesn't
# size in as expected. Use *Slot 2*, where pins 16-18 carry the dormant
# K0-K2 lines, so the strobe never fires and the module presents bank 0 as
# a plain unbanked 16K, sized correctly by the boot ROM. Declared
# compatible with both slots anyway (spec §1: compatible-hosts is a pin/
# electrical-compatibility list, not a "works well" guarantee) -- see
# MinorIssues.md's "CE-1638+ / CE-163F on a PC-1600 belong in Slot 2, not
# Slot 1" for the full writeup of the same issue on the throwaway card.

module-name: "CE-1638"
template: true   # read-only starting point; Name & Save copies it
compatible-hosts: [PC-1500, PC-1500A, PC-1600-Slot-1, PC-1600-Slot-2]
definition-terminology: PC-1500
battery: true

regions:
  - name: sram-128k
    content:
      kind: regular
      writable: true
      power-up-fill: 0x00
    # Region-level "is this a banked access at all" -- a pure gate, no
    # span/maps-to. The whole enable is Y0; the real slice mapping lives
    # in bank-window.
    addressing:
      chip-select: Y0
    banking:
      latch:
        type: trigger-based
        trigger: { pin: 18 }         # S3 (PC-1500) / S5 (PC-1500A) write strobe
        sampled-lines: [A0, A1, A2]  # bank number from the triggering write's address
        source-domain: address
      bank-count: 8
      bank-size: 0x4000              # 16 KB, exactly the Y0 window
      bank-window:
        chip-select: Y0
        span: 0x4000
        maps-to: 0x0000
