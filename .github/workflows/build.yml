name: Build

# Builds the Qt6/ prototype (see Qt6/README-worthy context in
# docs/Qt6-Port-Analysis.md) on Linux x86_64, Linux arm64, macOS, and
# Windows. Linux jobs just build and upload the raw executable --
# expert-only artifacts, not meant to run standalone on a clean machine
# (needs a system Qt6 install already present). macOS runs macdeployqt to
# embed the Qt frameworks (see Qt6/CMakeLists.txt's MACOSX_BUNDLE), then
# Developer-ID-signs the .app (hardened runtime), notarizes + staples it,
# and packages it into a signed/notarized/stapled .dmg -- same Developer
# ID/Team ID as SharpDataExchangeRust, see .github/macos-signing.md for the
# repo secrets this needs and how to rotate them. The Windows job also runs
# windeployqt so its uploaded artifact is a genuinely standalone-runnable
# folder (Qt DLLs + MSVC runtime bundled alongside the .exe), since Windows
# has no equivalent to Linux's "the system already has Qt installed" or
# macOS's shared Homebrew prefix.
on:
  push:
    branches: [dev-0.1.0]
  workflow_dispatch: {}

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt6 + build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev

      # Vendors Core/Basic/vendor/sharpdx/libsharpdx-linux.a from a
      # SharpDataExchangeRust GitHub release (see tools/fetch_sharpdx.sh)
      # so Qt6/CMakeLists.txt builds in preset/BASIC loading. Soft-fail: a
      # missing/unreachable release just means CalcU1600Qt builds without
      # that feature (see CMakeLists.txt's own SHARPDX_LIB EXISTS check),
      # not a broken build.
      - name: Fetch sharpdx (preset loading)
        shell: bash
        continue-on-error: true
        run: tools/fetch_sharpdx.sh

      - name: Configure
        run: cmake -S Qt6 -B Qt6/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build Qt6/build

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: calcu1600qt-linux-x86_64
          # The binary alone isn't runnable: AppPaths::bundledCardResourcesDir()
          # expects a "resources" folder (the *.card.yaml files) next to it --
          # CMakeLists.txt's POST_BUILD step already places one at
          # Qt6/build/resources, this just needs to actually get uploaded too
          # (ROMs/artwork don't have this problem -- those are baked into the
          # binary via resources/calc-u-1600.qrc).
          path: |
            Qt6/build/CalcU1600Qt
            Qt6/build/resources
          if-no-files-found: error

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    # GitHub-hosted Linux arm64 runners aren't available on every plan/repo
    # visibility combination -- don't fail the whole workflow if this one
    # can't be scheduled or the runner label isn't available; build on the
    # Raspberry Pi and upload that binary manually in that case (see
    # docs/Qt6-Port-Analysis.md's own build-target discussion).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt6 + build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev

      # See the linux-x86_64 job's identical step for what this does.
      - name: Fetch sharpdx (preset loading)
        shell: bash
        continue-on-error: true
        run: tools/fetch_sharpdx.sh

      - name: Configure
        run: cmake -S Qt6 -B Qt6/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build Qt6/build

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: calcu1600qt-linux-arm64
          # See the linux-x86_64 job's identical step for why resources/ is
          # needed too, not just the binary.
          path: |
            Qt6/build/CalcU1600Qt
            Qt6/build/resources
          if-no-files-found: error

  macos:
    runs-on: macos-14 # Apple Silicon (arm64) hosted runner
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt6 + build tools
        run: brew install qt cmake ninja

      - name: Configure
        run: |
          cmake -S Qt6 -B Qt6/build -G Ninja \
            -DCMAKE_PREFIX_PATH=$(brew --prefix qt) \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        # Produces a real .app bundle (Qt6/CMakeLists.txt's MACOSX_BUNDLE).
        run: cmake --build Qt6/build

      - name: Embed Qt frameworks (macdeployqt)
        # Without this the .app links Qt via an absolute Homebrew path
        # (/opt/homebrew/opt/qtbase/lib/...) -- it would only run on a Mac
        # with that exact Homebrew Qt installed. macdeployqt copies the Qt
        # frameworks into Contents/Frameworks and rewrites the binary's
        # rpaths to point there, making the bundle actually standalone --
        # required before signing/notarizing, since Gatekeeper doesn't care
        # but every non-dev Mac downloading this would otherwise crash on
        # launch.
        run: $(brew --prefix qt)/bin/macdeployqt Qt6/build/CalcU1600Qt.app

      # See ../macos-signing.md (same Developer ID, team 7Q3QN9AV9J, as
      # SharpDataExchangeRust) for how these repo secrets were produced and
      # how to rotate them.
      - name: Import signing certificate
        env:
          APP_P12_B64: ${{ secrets.APPLE_CERT_APPLICATION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"

          echo "$APP_P12_B64" | base64 --decode > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/app.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')

          APP_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n1)"
          if [ -z "$APP_IDENTITY" ]; then
            echo "::error::missing Developer ID Application identity after import"; exit 1
          fi
          echo "APP_IDENTITY=$APP_IDENTITY" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KEYCHAIN"    >> "$GITHUB_ENV"

      - name: Codesign the .app (Developer ID Application, hardened runtime)
        run: |
          set -euo pipefail
          APP=Qt6/build/CalcU1600Qt.app
          # --deep signs every embedded framework/dylib macdeployqt placed
          # under Contents/Frameworks too, not just the outer bundle.
          codesign --deep --force --timestamp --options runtime \
            --sign "$APP_IDENTITY" --keychain "$SIGN_KEYCHAIN" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notarize the .app
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo "$API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/asc_api_key.p8"
          APP=Qt6/build/CalcU1600Qt.app
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/CalcU1600Qt.zip"
          xcrun notarytool submit "$RUNNER_TEMP/CalcU1600Qt.zip" \
            --key "$RUNNER_TEMP/asc_api_key.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl -a -vvv "$APP"

      - name: Build the DMG
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE"
          cp -R Qt6/build/CalcU1600Qt.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Calc-U-1600" -srcfolder "$STAGE" \
            -ov -format UDZO Qt6/build/CalcU1600Qt.dmg

      - name: Sign + notarize + staple the DMG
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG=Qt6/build/CalcU1600Qt.dmg
          codesign --force --timestamp --sign "$APP_IDENTITY" --keychain "$SIGN_KEYCHAIN" "$DMG"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/asc_api_key.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -vvv -t open --context context:primary-signature "$DMG"

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc_api_key.p8"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: calcu1600qt-macos-arm64
          path: Qt6/build/CalcU1600Qt.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt6 (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2' # verify this is available in aqt's index if this step ever fails; bump to another 6.8.x/6.9.x release otherwise
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      # See the linux-x86_64 job's identical step for what this does.
      # `shell: bash` runs it via the Git Bash already on windows-latest
      # runners -- tools/fetch_sharpdx.sh is a POSIX sh script.
      - name: Fetch sharpdx (preset loading)
        shell: bash
        continue-on-error: true
        run: tools/fetch_sharpdx.sh

      - name: Configure
        run: cmake -S Qt6 -B Qt6/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build Qt6/build

      - name: Stage standalone-runnable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Qt6/dist | Out-Null
          Copy-Item Qt6/build/CalcU1600Qt.exe Qt6/dist/
          # AppPaths::bundledCardResourcesDir() expects a "resources" folder
          # (the *.card.yaml files) next to the .exe -- CMakeLists.txt's
          # POST_BUILD step places one at Qt6/build/resources, but that
          # doesn't end up in Qt6/dist/ on its own.
          Copy-Item Qt6/build/resources Qt6/dist/resources -Recurse
          # --compiler-runtime bundles the MSVC redistributable DLLs too,
          # so this runs on a clean Windows machine without the VC++
          # redistributable pre-installed, not just without a Qt install.
          windeployqt --release --compiler-runtime Qt6/dist/CalcU1600Qt.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: calcu1600qt-windows-x86_64
          path: Qt6/dist
          if-no-files-found: error
