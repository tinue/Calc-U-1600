    <rect x="402.00" y="354.00" width="20.00" height="7.00" rx="3"/> <!-- 0:a -->
    <rect x="422.00" y="361.00" width="7.00" height="24.50" rx="3"/> <!-- 0:b -->
    <rect x="422.00" y="392.50" width="7.00" height="24.50" rx="3"/> <!-- 0:c -->
